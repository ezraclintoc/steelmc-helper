# Builds release binaries for the supported targets when a vX.Y.Z tag is
# pushed, then attaches archives and per-file .sha256 checksums to a GitHub
# release for that tag.
name: release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { target: aarch64-apple-darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (tar)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          # No version in the filename so `releases/latest/download/<asset>`
          # is a stable URL for install.sh.
          asset="steelmc-helper-${{ matrix.target }}"
          tar -czf "dist/${asset}.tar.gz" -C "target/${{ matrix.target }}/release" steelmc-helper

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/steelmc-helper.exe" `
            -DestinationPath "dist/steelmc-helper-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect assets
        run: |
          mkdir release
          find dist -type f -exec mv {} release/ \;
          ls -la release

      - name: Checksums
        shell: bash
        run: |
          cd release
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
