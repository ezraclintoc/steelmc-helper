[package]
name = "steelmc-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# Keep the shipped helper small: it is downloaded by install.sh on every install.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]
cliclack = "0.5.6"
flate2 = "1"
self_update = { version = "1.3.1", default-features = false, features = ["ureq", "rustls", "github"] }
serde_json = "1"
tar = "0.4"
